<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>TV Alertas — Monitor de televisión española</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0b;
  --bg2: #111113;
  --bg3: #1a1a1d;
  --border: #2a2a2e;
  --text: #e8e8ec;
  --text-muted: #6b6b78;
  --accent: #e8c547;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

.site-header {
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(10,10,11,0.95);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.site-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--accent);
}

.site-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.nav-link {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 0.5px;
  transition: color 0.2s;
}
.nav-link:hover { color: var(--accent); }

main { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

.fecha-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  letter-spacing: 3px;
  color: var(--text);
  margin-bottom: 4px;
}

.resumen-ejecutivo {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 40px;
  padding-left: 16px;
  border-left: 3px solid var(--accent);
}

.sin-alertas {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-muted);
}

.sin-alertas .icon { font-size: 48px; margin-bottom: 16px; }
.sin-alertas h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; margin-bottom: 8px; color: var(--text); }

.categoria-bloque { margin-bottom: 40px; }

.categoria-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.categoria-icon { font-size: 20px; }

.categoria-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 2px;
}

.categoria-count {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--bg3);
  color: var(--text-muted);
  font-weight: 500;
}

.alerta-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 10px;
  border-left: 3px solid transparent;
  transition: border-color 0.2s, background 0.2s;
}

.alerta-card:hover { background: var(--bg3); }

.alerta-titular {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 4px;
  color: var(--text);
}

.alerta-detalle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.alerta-meta {
  display: flex;
  gap: 12px;
  font-size: 12px;
}

.badge-cadena {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 7px;
  color: var(--text-muted);
}

.badge-fuente { color: var(--text-muted); font-style: italic; }

.historico-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 24px;
}

.dia-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-decoration: none;
  display: block;
  transition: border-color 0.2s, background 0.2s;
}

.dia-card:hover { background: var(--bg3); border-color: var(--accent); }

.dia-fecha {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 1px;
  color: var(--text);
  margin-bottom: 4px;
}

.dia-alertas { font-size: 12px; color: var(--text-muted); }

.dia-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 6px;
  vertical-align: middle;
}

.dia-sin-alertas .dia-dot { background: var(--border); }

footer {
  border-top: 1px solid var(--border);
  padding: 20px 32px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<header class="site-header"><div><div class="site-title">TV ALERTAS</div><div class="site-subtitle">Monitor de televisión española</div></div></header>
<main><h2 style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--text-muted);margin-top:48px;margin-bottom:0">HISTÓRICO</h2><div class="historico-grid"><a href="dias/2026-06-07.html" class="dia-card" style="border-color:var(--accent);grid-column:1/-1;"><div style="font-size:11px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Hoy</div><div class="dia-fecha">DOMINGO 7 DE JUNIO DE 2026</div><div class="dia-alertas"><span class="dia-dot dia-sin-alertas"></span>0 alertas detectadas · Jornada sin eventos relevantes, solo datos rutinarios de informativos y resúmene...</div></a></div></main>
<footer>Actualizado diariamente a las 09:00 · Fuentes: Barlovento, Fórmula TV, Vertele, DOS30</footer>
</body>
</html>
